<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociality | Red Social</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navegación -->
    <nav id="mainNav">
        <div class="logo">
            <img src="logo.png" alt="Sociality Logo" style="width: 140px; height: auto;">
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="nav-item" onclick="showFeatures()">Features</a></li>
            <li><a href="#" class="nav-item" onclick="showHowItWorks()">How it works</a></li>
            <li><a href="#" class="nav-item" onclick="showPrivacy()">Privacy</a></li>
        </ul>
        <div class="nav-btns" id="authBtns">
            <button class="logn-btn" id="openLogin">Entrar</button>
            <button class="btn-join" id="openRegister">Unirse</button>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main id="appContent">
        <section class="hero">
            <div class="main-content">
                <div class="text-side">
                    <h1 class="anim">Conecta con <br>tu mundo.</h1>
                    <p class="anim">Crea un perfil, comparte tus ideas y chatea en tiempo real con Sociality.</p>
                    <button class="btn-join anim" id="heroStartBtn">Empezar ahora</button>
                </div>
                <div class="image-side anim">
                    <img src="back-image.png" class="back-img" alt="Fondo decorativo">
                    <img src="pic.png" class="feature-img" alt="Interfaz Sociality">
                </div>
            </div>
        </section>
    </main>

    <!-- Barra Lateral de Contactos -->
    <aside class="sidebar-right" id="sidebarRight" style="display: none;">
        <h3>Personas</h3>
        <div id="usersList"></div>
    </aside>

    <!-- MODALES -->
    
    <!-- Modal General (Login/Registro/Features) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div id="modalFormContainer"></div>
            <p class="close-text" id="closeModal">Cerrar</p>
        </div>
    </div>

    <!-- Modal de Recuperar Contraseña -->
    <div class="modal-overlay" id="recoveryModal">
        <div class="modal-box">
            <h2>Recuperar Acceso</h2>
            <p>Introduce tu nombre de usuario para validar tu identidad.</p>
            <input type="text" id="recoveryUser" placeholder="Nombre de usuario">
            
            <div id="recoveryStep2" style="display:none">
                <input type="password" id="newPass" placeholder="Nueva Contraseña">
                <button class="btn-join" onclick="handleResetPass()" style="width: 100%;">Cambiar Contraseña</button>
            </div>
            
            <button class="btn-join" id="btnVerifyUser" onclick="verifyUserForRecovery()" style="width: 100%; margin-top: 10px;">Verificar Usuario</button>
            <p class="close-text" onclick="closeRecoveryModal()">Cancelar</p>
        </div>
    </div>

    <!-- Ventana de Chat Flotante -->
    <div id="chatWindow" class="chat-window" style="display: none;">
        <div class="chat-header">
            <span id="chatUserName">Usuario</span>
            <button onclick="closeChat()">×</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- JS al final para asegurar que el DOM esté cargado -->
    <script src="script.js"></script>
</body>
</html>
