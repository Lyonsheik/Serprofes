<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Registradora con QR</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="ticket" id="ticket-area">
        <h2>🧾 Ticket de Compra</h2>
        
        <ul id="lista-producto"></ul>

        <div class="panel-acciones">
            <button class="btn-calc" onclick="cobrar()">🧮 Calcular Total</button>
            <button class="btn-desc" onclick="aplicarDescuento(20)">🏷️ Aplicar -20%</button>
            <button class="btn-pdf" onclick="imprimirTicket()">🖨️ Imprimir PDF</button>
        </div>

        <div class="total-box" id="resultado-total">
            Presione calcular para empezar...
        </div>

        <!-- CONTENEDOR DEL QR -->
        <div id="contenedor-qr" style="text-align: center; margin-top: 20px; display: none;">
            <p style="font-size: 10px;">Escanea para validar ticket</p>
            <img id="codigo-qr" src="" alt="Código QR del ticket" style="width: 150px; height: 150px;">
        </div>
    </div>
</body>
</html>
